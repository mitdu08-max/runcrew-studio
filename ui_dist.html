function refreshAdbBridges() {\r
  exec('adb devices', { timeout: 6000 }, (err, stdout) => {\r
    if (err) {\r
      logOnce('noadb', '⚠️  [ADB] adb introuvable dans le PATH — installe les platform-tools Android.');\r
      return;\r
    }\r
    const lines = String(stdout).split(/\\r?\\n/).slice(1)\r
      .map(l => l.trim())\r
      .filter(l => l && !l.startsWith('*') && !/^list/i.test(l));\r
    const entries = lines.map(l => l.split(/\\s+/)).filter(e => e[0]);\r

// ===========================================================================\r
// §5  GÉODÉSIE\r
// ===========================================================================\r
function calculateDistance(p1, p2) {\r
  const R = 6371000;\r
  const dLat = (p2[0] - p1[0]) * Math.PI / 180;\r
  const dLon = (p2[1] - p1[1]) * Math.PI / 180;\r
  const a = Math.sin(dLat / 2) ** 2 +\r
    Math.cos(p1[0] * Math.PI / 180) * Math.cos(p2[0] * Math.PI / 180) * Math.sin(dLon / 2) ** 2;\r
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));\r
}\r
\r
function computeCumulative(points) {\r
  const cum = new Array(points.length);\r
  cum[0] = 0;\r
  for (let i = 1; i < points.length; i++) {\r
    cum[i] = cum[i - 1] + calculateDistance(points[i - 1], points[i]);\r
  }\r
  return cum;\r
}\r
\r
function getExactPositionAtDistance(points, cum, targetDist) {\r
  if (points.length === 0) return null;\r
  if (points.length === 1) return { pos: points[0], ratio: 0, seg: 0 };\r
  const len = cum[points.length - 1];\r
  if (targetDist <= 0) return { pos: points[0], ratio: 0, seg: 0 };\r
  if (targetDist >= len) return { pos: points[points.length - 1], ratio: 1, seg: points.length - 2 };\r
  let lo = 0, hi = points.length - 1;\r
  while (lo < hi - 1) {\r
    const mid = (lo + hi) >> 1;\r
    if (cum[mid] <= targetDist) lo = mid; else hi = mid;\r
  }\r
  const segDist = cum[lo + 1] - cum[lo];\r
  const ratio = segDist > 0 ? (targetDist - cum[lo]) / segDist : 0;\r
  return {\r
    pos: [\r
      points[lo][0] + (points[lo + 1][0] - points[lo][0]) * ratio,\r
      points[lo][1] + (points[lo + 1][1] - points[lo][1]) * ratio\r
    ],\r
    ratio, seg: lo\r
  };\r
}\r
\r
function bearingBetween(p1, p2) {\r
  const rad = Math.PI / 180;\r
  const y = Math.sin((p2[1] - p1[1]) * rad) * Math.cos(p2[0] * rad);\r
  const x = Math.cos(p1[0] * rad) * Math.sin(p2[0] * rad) -\r
    Math.sin(p1[0] * rad) * Math.cos(p2[0] * rad) * Math.cos((p2[1] - p1[1]) * rad);\r
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;\r
}\r
\r
function movingAvg(arr, w) {\r
  const n = arr.length, out = new Array(n);\r
  for (let i = 0; i < n; i++) {\r
    let s = 0, c = 0;\r
    for (let k = Math.max(0, i - w); k <= Math.min(n - 1, i + w); k++) { s += arr[k]; c++; }\r
    out[i] = s / c;\r
  }\r
  return out;\r
}\r

// ===========================================================================\r
// §6  PISTE D'ATHLÉTISME 400 m — géométrie officielle World Athletics\r
// ---------------------------------------------------------------------------\r
// 2 droites de 84,39 m + 2 demi-cercles. Corde intérieure : rayon 36,50 m.\r
// Ligne de mesure : couloir 1 = +0,30 m ; couloirs 2-8 = +0,20 m.\r
// Largeur de couloir : 1,22 m. Sens anti-horaire (pelouse à gauche).\r
//   C1 400,00 · C2 407,04 · C3 414,70 · C4 422,37\r
//   C5 430,03 · C6 437,70 · C7 445,36 · C8 453,03\r
// ===========================================================================\r
const TRACK_STRAIGHT = 84.39;\r
const TRACK_KERB_R = 36.5;\r
const TRACK_LANE_W = 1.22;\r
const TRACK_LANES = 8;\r
\r
let trackMode = false;\r
let trackLane = 1;\r
let trackBearing = 90;\r
let trackOrigin = null;\r
let trackLaneLength = 400;\r
\r
function laneRadius(n) {\r
  return n <= 1 ? TRACK_KERB_R + 0.3 : TRACK_KERB_R + (n - 1) * TRACK_LANE_W + 0.2;\r
}\r
function laneLength(n) {\r
  return 2 * TRACK_STRAIGHT + 2 * Math.PI * laneRadius(n);\r
}\r
function laneTable() {\r
  const out = [];\r
  for (let n = 1; n <= TRACK_LANES; n++) {\r
    out.push({\r
      lane: n,\r
      length: Math.round(laneLength(n) * 100) / 100,\r
      radius: Math.round(laneRadius(n) * 100) / 100,\r
      stagger: Math.round((laneLength(n) - laneLength(1)) * 100) / 100\r
    });\r
  }\r
  return out;\r
}\r
function metersPerDegree(lat) {\r
  const p = lat * Math.PI / 180;\r
  return {\r
    lat: 111132.92 - 559.82 * Math.cos(2 * p) + 1.175 * Math.cos(4 * p),\r
    lon: 111412.84 * Math.cos(p) - 93.5 * Math.cos(3 * p)\r
  };\r
}\r
function localToLatLon(origin, bearingDeg, x, y) {\r
  const t = bearingDeg * Math.PI / 180;\r
  const east = x * Math.sin(t) + y * Math.cos(t);\r
  const north = x * Math.cos(t) - y * Math.sin(t);\r
  const m = metersPerDegree(origin[0]);\r
  return [origin[0] + north / m.lat, origin[1] + east / m.lon];\r
}\r
function buildLanePolyline(origin, bearingDeg, n, stepM) {\r
  stepM = stepM || 2;\r
  const r1 = laneRadius(1);\r
  const r = laneRadius(n);\r
  const S = TRACK_STRAIGHT;\r
  const cx = S / 2, cy = r1;\r
  const L = (x, y) => localToLatLon(origin, bearingDeg, x + cx, y + cy);\r
  const pts = [];\r
  const nStraight = Math.max(2, Math.ceil(S / stepM));\r
  for (let i = 0; i < nStraight; i++) pts.push(L(-S / 2 + (S * i) / nStraight, -r));\r
  const nArc = Math.max(8, Math.ceil((Math.PI * r) / stepM));\r
  for (let i = 0; i < nArc; i++) {\r
    const a = -Math.PI / 2 + (Math.PI * i) / nArc;\r
    pts.push(L(S / 2 + r * Math.cos(a), r * Math.sin(a)));\r
  }\r
  for (let i = 0; i < nStraight; i++) pts.push(L(S / 2 - (S * i) / nStraight, r));\r
  for (let i = 0; i < nArc; i++) {\r
    const a = Math.PI / 2 + (Math.PI * i) / nArc;\r
    pts.push(L(-S / 2 + r * Math.cos(a), r * Math.sin(a)));\r
  }\r
  pts.push(pts[0]);\r
  return pts;\r
}\r
function buildAllLanes(origin, bearingDeg) {\r
  const out = [];\r
  for (let n = 1; n <= TRACK_LANES; n++) out.push(buildLanePolyline(origin, bearingDeg, n, 3));\r
  return out;\r
}\r

// §7  MOTEUR D'ÉLÉVATION RÉELLE (Open-Meteo SRTM 90 m, sans clé API)\r
// ---------------------------------------------------------------------------\r
// Remplace l'ancienne sinusoïde "50 + sin(x)*15" qui figeait l'altitude à ~52 m.\r
// ===========================================================================\r
function getJson(url) {\r
  if (typeof fetch === 'function') {\r
    return fetch(url).then(r => {\r
      if (!r.ok) throw new Error('HTTP ' + r.status);\r
      return r.json();\r
    });\r
  }\r
  return new Promise((resolve, reject) => {\r
    https.get(url, (res) => {\r
      let data = '';\r
      res.on('data', (c) => data += c);\r
      res.on('end', () => { try { resolve(JSON.parse(data)); } catch (e) { reject(e); } });\r
    }).on('error', reject);\r
  });\r
}\r
\r
async function fetchElevBatch(points, idxSlice) {\r
  const lats = idxSlice.map(i => points[i][0].toFixed(5)).join(',');\r
  const lons = idxSlice.map(i => points[i][1].toFixed(5)).join(',');\r
  const url = 'https://api.open-meteo.com/v1/elevation?latitude=' + lats + '&longitude=' + lons;\r
  for (let attempt = 0; attempt < 2; attempt++) {\r
    try {\r
      const j = await getJson(url);\r
      if (Array.isArray(j.elevation)) return j.elevation;\r
    } catch (e) {\r
      if (attempt === 1) return [];\r
      await new Promise(res => setTimeout(res, 600));\r
    }\r
  }\r
  return [];\r
}\r
\r
async function buildElevationProfile(points, cum) {\r
  if (points.length < 2) return null;\r
  const total = cum[cum.length - 1];\r
  const target = Math.max(30, Math.min(180, Math.round(total / 110)));\r
  const idxSet = new Set();\r
  if (points.length <= target) {\r
    for (let i = 0; i < points.length; i++) idxSet.add(i);\r
  } else {\r
    const step = (points.length - 1) / (target - 1);\r
    for (let i = 0; i < target; i++) idxSet.add(Math.round(i * step));\r
    idxSet.add(0); idxSet.add(points.length - 1);\r
  }\r
  const idx = Array.from(idxSet).sort((a, b) => a - b);\r
\r
  const sampleEle = new Array(idx.length).fill(null);\r
  const BATCH = 96;\r
  for (let b = 0; b < idx.length; b += BATCH) {\r
    const slice = idx.slice(b, b + BATCH);\r
    const res = await fetchElevBatch(points, slice);\r
    for (let k = 0; k < res.length; k++) sampleEle[b + k] = res[k];\r
  }\r
\r
  const validCount = sampleEle.filter(e => e != null && isFinite(e)).length;\r
  if (validCount < idx.length * 0.4) return null;\r
\r
  const filled = sampleEle.map((e, i) => {\r
    if (e != null && isFinite(e)) return e;\r
    for (let r = 1; r < idx.length; r++) {\r
      const a = sampleEle[i - r], b2 = sampleEle[i + r];\r
      if (a != null && isFinite(a)) return a;\r
      if (b2 != null && isFinite(b2)) return b2;\r
    }\r
    return 60;\r
  });\r
\r
  const sampleDist = idx.map(i => cum[i]);\r
  const dense = new Array(points.length);\r
  for (let i = 0; i < points.length; i++) {\r
    const d = cum[i];\r
    if (d <= sampleDist[0]) { dense[i] = filled[0]; continue; }\r
    if (d >= sampleDist[sampleDist.length - 1]) { dense[i] = filled[filled.length - 1]; continue; }\r
    let lo = 0, hi = sampleDist.length - 1;\r
    while (lo < hi - 1) {\r
      const mid = (lo + hi) >> 1;\r
      if (sampleDist[mid] <= d) lo = mid; else hi = mid;\r
    }\r
    const seg = sampleDist[lo + 1] - sampleDist[lo];\r
    const t = seg > 0 ? (d - sampleDist[lo]) / seg : 0;\r
    dense[i] = filled[lo] + (filled[lo + 1] - filled[lo]) * t;\r
  }\r
  return movingAvg(dense, 2).map(e => Math.round(e * 10) / 10);\r
}\r
\r
function eleAtDistance(targetDist) {\r
  if (!trackEle || trackEle.length === 0) return null;\r
  const n = trackEle.length;\r
  if (targetDist <= 0) return trackEle[0];\r
  const len = trackCum[n - 1];\r
  if (targetDist >= len) return trackEle[n - 1];\r
  let lo = 0, hi = n - 1;\r
  while (lo < hi - 1) {\r
    const mid = (lo + hi) >> 1;\r
    if (trackCum[mid] <= targetDist) lo = mid; else hi = mid;\r
  }\r
  const seg = trackCum[lo + 1] - trackCum[lo];\r
  const t = seg > 0 ? (targetDist - trackCum[lo]) / seg : 0;\r
  return Math.round((trackEle[lo] + (trackEle[lo + 1] - trackEle[lo]) * t) * 10) / 10;\r
}\r

// ===========================================================================\r
// §8  PHYSIOLOGIE — VMA / FRÉQUENCE CARDIAQUE                    [NOUVEAU v3]\r
// ---------------------------------------------------------------------------\r
// Karvonen : FC cible = FC repos + %FCR × (FCmax − FC repos)\r
// Tanaka    : FCmax ≈ 208 − 0,7 × âge      Astrand : 220 − âge\r
// Correspondance %VMA → %FCR : (pct − 0,30) / 0,70, bornée [0 ; 1]\r

let athlete = {\r

\r
function karvonen(pctHRR) {\r
  return Math.round(athlete.fcRepos + (athlete.fcMax - athlete.fcRepos) * pctHRR);\r
}\r
function pctVmaToHRR(pctVma) {\r
  const p = Math.max(0.3, Math.min(1.3, pctVma));\r
  return Math.max(0, Math.min(1, (p - 0.3) / 0.7));\r

function hrForIntensity(pctVma) {\r

function paceString(kmh) {\r

const ZONES = [\r

];\r
\r
function zoneFor(pctVma) {\r
  for (let i = 0; i < ZONES.length; i++) if (pctVma < ZONES[i].hi) return ZONES[i];\r
  return ZONES[ZONES.length - 1];\r

/** Tableau VMA complet (50 % → 120 %). */\r
function vmaTable() {\r
  const steps = [0.5, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0, 1.05, 1.1, 1.2];\r
  return steps.map(p => {\r
    const kmh = Math.round(athlete.vma * p * 10) / 10;\r
    const z = zoneFor(p);\r
    return {\r
      pct: Math.round(p * 100),\r

/** Temps de passage prédits sur les distances de référence. */\r
function predictions() {\r
  const rows = [\r
    { dist: '1000 m', m: 1000, pct: 1.00 },\r
    { dist: '3000 m', m: 3000, pct: 0.94 },\r
    { dist: '5 km',   m: 5000, pct: 0.90 },\r
    { dist: '10 km',  m: 10000, pct: 0.855 },\r
    { dist: 'Semi',   m: 21097, pct: 0.81 },\r
    { dist: 'Marathon', m: 42195, pct: 0.76 }\r
  ];\r
  return rows.map(r => {\r
    const kmh = athlete.vma * r.pct;\r
    const sec = (r.m / 1000 / kmh) * 3600;\r
    const h = Math.floor(sec / 3600);\r
    const m = Math.floor((sec % 3600) / 60);\r
    const s = Math.round(sec % 60);\r
    const pad = (v) => (v < 10 ? '0' + v : '' + v);\r
    return {\r
      dist: r.dist,\r
      time: h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s),\r

// §9  MOTEUR DE SÉANCES                                          [NOUVEAU v3]\r
// ---------------------------------------------------------------------------\r
// Une séance = liste de phases. Chaque phase porte une intensité en %VMA et\r

function warm(min) { return { kind: 'warmup', label: 'Échauffement ' + min + "'", pctVma: 0.62, durationS: min * 60 }; }\r
function cool(min) { return { kind: 'cooldown', label: 'Retour au calme ' + min + "'", pctVma: 0.55, durationS: min * 60 }; }\r
\r
function intervalsTime(reps, workS, recS, pct, recPct, block) {\r
  const out = [];\r
  for (let i = 1; i <= reps; i++) {\r
    out.push({ kind: 'work', label: workS + 's @ ' + Math.round(pct * 100) + '% VMA', pctVma: pct, durationS: workS, rep: i, repTotal: reps, block: block });\r
    out.push({ kind: 'recovery', label: 'Récup ' + recS + 's', pctVma: recPct, durationS: recS, rep: i, repTotal: reps, block: block });\r
  }\r
  return out;\r
}\r
\r
function intervalsDist(reps, distM, recS, pct, recPct) {\r
  const out = [];\r
  for (let i = 1; i <= reps; i++) {\r
    out.push({ kind: 'work', label: distM + ' m @ ' + Math.round(pct * 100) + '% VMA', pctVma: pct, distanceM: distM, rep: i, repTotal: reps });\r
    out.push({ kind: 'recovery', label: 'Récup ' + recS + 's', pctVma: recPct, durationS: recS, rep: i, repTotal: reps });\r
  }\r
  return out;\r
}\r
\r

      { kind: 'work', label: '10\\' @ 88% VMA', pctVma: 0.88, durationS: 600, rep: 3, repTotal: 3 },\r

\r
  // ---------- PYRAMIDE ----------\r

\r
  const ladderT = [1, 2, 3, 4, 5, 4, 3, 2, 1];\r

\r
  // ---------- TABATA ----------\r

\r
  S.push({ id: 'tabata-2x', name: 'Tabata double 2 × 8', family: 'Tabata', icon: '💥',\r

\r
  // ---------- FARTLEK ----------\r

    .forEach((b, i) => {\r
      fk.push({ kind: 'work', label: b.m + '\\' @ ' + Math.round(b.p * 100) + '%', pctVma: b.p, durationS: b.m * 60, rep: i + 1, repTotal: 5 });\r
      fk.push({ kind: 'recovery', label: 'Récup 2\\'', pctVma: 0.55, durationS: 120 });\r
    });\r
  fk.push(cool(10));\r
  S.push({ id: 'fartlek', name: 'Fartlek 5-4-3-2-1', family: 'Fartlek', icon: '🌊',\r
    desc: 'Jeu d\\'allures suédois : blocs dégressifs, intensité croissante.', phases: fk });\r
\r
  const fn = [warm(10)];\r
  for (let i = 1; i <= 6; i++) {\r
    fn.push({ kind: 'work', label: '1\\' @ 100%', pctVma: 1.00, durationS: 60, rep: i, repTotal: 6, block: 1 });\r
    fn.push({ kind: 'recovery', label: 'Récup 1\\'', pctVma: 0.60, durationS: 60 });\r
  }\r
  for (let i = 1; i <= 4; i++) {\r
    fn.push({ kind: 'work', label: '2\\' @ 92%', pctVma: 0.92, durationS: 120, rep: i, repTotal: 4, block: 2 });\r
    fn.push({ kind: 'recovery', label: 'Récup 1\\'', pctVma: 0.60, durationS: 60 });\r

\r

    phases: [warm(20), { kind: 'work', label: '6\\' à fond', pctVma: 1.00, durationS: 360 }, cool(10)] });\r
\r
  const vv = [warm(10)];\r
  for (let i = 0; i < 18; i++) {\r
    const kmh = 8 + i * 0.5;\r
    vv.push({ kind: 'work', label: 'Palier ' + (i + 1) + ' — ' + kmh.toFixed(1) + ' km/h',\r
      pctVma: kmh / Math.max(1, athlete.vma), durationS: 60, rep: i + 1, repTotal: 18, absKmh: kmh });\r
  }\r
  vv.push(cool(8));\r
  S.push({ id: 'vameval', name: 'VAMEVAL (paliers)', family: 'Test', icon: '🎯',\r
    desc: 'Paliers de 1\\' : +0,5 km/h par minute à partir de 8 km/h.', phases: vv });\r
\r

\r
let SESSIONS = buildSessions();\r
\r
function sessionSummary(s) {\r
  let totalS = 0, totalM = 0, workS = 0, reps = 0;\r
  s.phases.forEach(p => {\r
    const kmh = p.absKmh != null ? p.absKmh : athlete.vma * p.pctVma;\r
    const mps = kmh / 3.6;\r
    let dur = p.durationS || 0;\r
    if (p.distanceM) dur = mps > 0 ? p.distanceM / mps : 0;\r
    totalS += dur;\r
    totalM += p.distanceM != null ? p.distanceM : mps * dur;\r
    if (p.kind === 'work') { workS += dur; reps++; }\r
  });\r
  return {\r
    totalS: Math.round(totalS),\r
    totalKm: Math.round(totalM / 10) / 100,\r
    workS: Math.round(workS),\r
    reps: reps\r
  };\r
}\r
\r
function sessionCatalog() {\r
  return SESSIONS.map(s => {\r
    const sum = sessionSummary(s);\r
    return { id: s.id, name: s.name, family: s.family, icon: s.icon, desc: s.desc,\r
      totalS: sum.totalS, totalKm: sum.totalKm, reps: sum.reps, phases: s.phases.length };\r
  });\r
}\r
\r
// ----- état d'exécution de la séance -----\r
let workout = null;        // séance active\r
let wkPhaseIdx = 0;\r
let wkPhaseElapsed = 0;    // s écoulées dans la phase\r
let wkPhaseDistance = 0;   // m parcourus dans la phase\r
let wkElapsed = 0;         // s depuis le début de la séance\r
let wkActive = false;\r
\r
function currentPhase() {\r
  if (!wkActive || !workout) return null;\r
  return workout.phases[wkPhaseIdx] || null;\r
}\r
\r
function phaseTargetKmh(p) {\r
  if (!p) return manualSpeedKmh;\r
  if (p.absKmh != null) return p.absKmh;\r
  return Math.round(athlete.vma * p.pctVma * 10) / 10;\r
}\r
\r
/** Durée totale (s) d'une phase, distance convertie en temps si besoin. */\r
function phaseDurationS(p) {\r
  if (!p) return 0;\r
  if (p.durationS != null) return p.durationS;\r
  const kmh = phaseTargetKmh(p);\r
  return kmh > 0 ? p.distanceM / (kmh / 3.6) : 0;\r
}\r
\r
function startWorkout(id) {\r
  const s = SESSIONS.filter(x => x.id === id)[0];\r
  if (!s) return false;\r
  workout = s;\r
  wkActive = true;\r
  wkPhaseIdx = 0;\r
  wkPhaseElapsed = 0;\r
  wkPhaseDistance = 0;\r
  wkElapsed = 0;\r
  speedKmh = phaseTargetKmh(workout.phases[0]);\r
  currentHr = athlete.fcRepos + 8;\r
  console.log('🏋️  [SÉANCE] ' + s.name + ' — ' + s.phases.length + ' phases — VMA ' + athlete.vma + ' km/h');\r
  broadcastWorkoutState();\r
  return true;\r
}\r
\r
function stopWorkout() {\r
  if (!wkActive) return;\r
  wkActive = false;\r
  workout = null;\r
  speedKmh = manualSpeedKmh;\r
  console.log('🏋️  [SÉANCE] Terminée / arrêtée.');\r
  broadcast({ type: 'workout', active: false });\r
}\r
\r
/** Passe à la phase suivante (récupération automatique). */\r
function nextPhase(auto) {\r
  if (!workout) return;\r
  wkPhaseIdx++;\r
  wkPhaseElapsed = 0;\r
  wkPhaseDistance = 0;\r
  if (wkPhaseIdx >= workout.phases.length) {\r
    console.log('🏁 [SÉANCE] ' + workout.name + ' TERMINÉE en ' + Math.round(wkElapsed / 60) + ' min !');\r
    broadcast({ type: 'workout', active: false, finished: true, name: workout.name, elapsedS: Math.round(wkElapsed) });\r
    wkActive = false;\r
    workout = null;\r
    speedKmh = manualSpeedKmh;\r
    return;\r
  }\r
  const p = currentPhase();\r
  speedKmh = phaseTargetKmh(p);\r
  if (auto) {\r
    const icon = p.kind === 'work' ? '🔴' : p.kind === 'recovery' ? '🟢' : p.kind === 'rest' ? '🔵' : '⚪';\r
    console.log(icon + ' [SÉANCE] ' + p.label + '  →  ' + speedKmh.toFixed(1) + ' km/h (' + paceString(speedKmh) + '/km)');\r
  }\r
  broadcastWorkoutState();\r
}\r
\r
/** Avance le moteur de séance de dt secondes. */\r
function tickWorkout(dt, metersAdvanced) {\r
  if (!wkActive || !workout) return;\r
  const p = currentPhase();\r
  if (!p) return;\r
  wkPhaseElapsed += dt;\r
  wkPhaseDistance += metersAdvanced;\r
  wkElapsed += dt;\r
\r
  // inertie cardiaque : la FC tend vers la cible avec ~25 s de constante\r
  const targetHr = hrForIntensity(p.pctVma);\r
  currentHr += (targetHr - currentHr) * (1 - Math.exp(-dt / 25));\r
\r
  const done = p.distanceM != null\r
    ? wkPhaseDistance >= p.distanceM\r
    : wkPhaseElapsed >= p.durationS;\r
  if (done) nextPhase(true);\r
}\r
\r
function workoutState() {\r
  if (!wkActive || !workout) return { type: 'workout', active: false };\r
  const p = currentPhase();\r
  const totalPhaseS = phaseDurationS(p);\r
  const remainS = p.distanceM != null\r
    ? Math.max(0, (p.distanceM - wkPhaseDistance) / Math.max(0.1, speedKmh / 3.6))\r
    : Math.max(0, p.durationS - wkPhaseElapsed);\r
  const nextP = workout.phases[wkPhaseIdx + 1] || null;\r
  const z = zoneFor(p.pctVma);\r
  return {\r
    type: 'workout',\r
    active: true,\r
    sessionId: workout.id,\r
    sessionName: workout.name,\r
    family: workout.family,\r
    phaseIndex: wkPhaseIdx,\r
    phaseCount: workout.phases.length,\r
    kind: p.kind,\r
    label: p.label,\r
    pctVma: Math.round(p.pctVma * 100),\r
    targetKmh: phaseTargetKmh(p),\r
    targetPace: paceString(phaseTargetKmh(p)),\r
    targetHr: hrForIntensity(p.pctVma),\r
    zone: z.z,\r
    zoneName: z.name,\r
    zoneColor: z.color,\r
    rep: p.rep || null,\r
    repTotal: p.repTotal || null,\r
    block: p.block || null,\r
    phaseElapsedS: Math.round(wkPhaseElapsed * 10) / 10,\r
    phaseTotalS: Math.round(totalPhaseS),\r
    phaseRemainS: Math.round(remainS * 10) / 10,\r
    phaseProgress: totalPhaseS > 0 ? Math.min(100, Math.round((wkPhaseElapsed / totalPhaseS) * 1000) / 10) : 0,\r
    phaseDistanceM: Math.round(wkPhaseDistance),\r
    phaseTargetM: p.distanceM || null,\r
    nextLabel: nextP ? nextP.label : 'Fin de séance',\r
    nextKind: nextP ? nextP.kind : null,\r
    elapsedS: Math.round(wkElapsed),\r
    hr: Math.round(currentHr)\r
  };\r
}\r
\r
function broadcastWorkoutState() {\r
  broadcast(workoutState());\r
}\r
\r
// ===========================================================================\r
// §10  DIFFUSION & BOUCLE DE SIMULATION\r
// ===========================================================================\r
function currentFixPoint() {\r
  if (rawTrack.length > 0 && trackCum.length > 0) {\r
    const cur = getExactPositionAtDistance(rawTrack, trackCum, currentProgressMeters);\r
    if (cur) return cur.pos;\r
  }\r
  return anchorPoint;\r
}\r
\r
function updateIdleHeartbeat() {\r
  const shouldRun = armed && !isRunning && !!currentFixPoint() && clients.length > 0;\r
  if (shouldRun && !idleInterval) {\r
    idleInterval = setInterval(() => broadcastCurrentPosition(), 1000);\r
    console.log('🎯 [PONT ARMÉ] Fix mock émis à 1 Hz (vitesse 0) — le Pacer se cale sans attendre le GPS.');\r
  } else if (!shouldRun && idleInterval) {\r
    clearInterval(idleInterval);\r
    idleInterval = null;\r
  }\r
}\r
\r
function broadcastCurrentPosition() {\r
  const hasTrack = rawTrack.length > 0 && trackCum.length > 0;\r
  let pos = null, heading = 0, alt = null;\r
\r
  if (hasTrack) {\r
    const cur = getExactPositionAtDistance(rawTrack, trackCum, currentProgressMeters);\r
    if (!cur) return;\r
    pos = cur.pos;\r
    const ahead = getExactPositionAtDistance(rawTrack, trackCum, Math.min(totalTrackLengthMeters, currentProgressMeters + 8));\r
    heading = ahead ? bearingBetween(pos, ahead.pos) : 0;\r
    alt = eleAtDistance(currentProgressMeters);\r
  } else if (anchorPoint) {\r
    pos = anchorPoint;\r
    alt = anchorAlt;\r
  } else {\r
    return;\r
  }\r
\r
  // Anti-téléport : glissement progressif au lieu d'un saut sec\r
  let outLat = pos[0], outLon = pos[1];\r
  if (warpFrom && warpMs > 0) {\r
    const t = (Date.now() - warpStart) / warpMs;\r
    if (t >= 1) warpFrom = null;\r
    else {\r
      const k = t < 0 ? 0 : t;\r
      outLat = warpFrom[0] + (pos[0] - warpFrom[0]) * k;\r
      outLon = warpFrom[1] + (pos[1] - warpFrom[1]) * k;\r
    }\r
  }\r
\r
  const moving = isRunning && !isPaused;\r
  const wk = wkActive ? workoutState() : null;\r
\r
  broadcast({\r
    type: 'position',\r
    lat: outLat, lon: outLon, lng: outLon,\r
    speed: moving ? (speedKmh * 1000) / 3600 : 0,\r
    speedKmh: moving ? speedKmh : 0,\r
    heading: heading,\r
    altitude: alt != null ? alt : baseAlt,\r
    altitudeSource: alt != null ? 'srtm' : 'fallback',\r
    accuracy: 3.0,\r
    // trame GPS complète : certaines apps refusent un mock incomplet\r
    provider: 'gps',\r
    satellites: 12,\r
    bearingAccuracy: 5.0,\r
    verticalAccuracy: 3.0,\r
    mock: true,\r
    fix: true,\r
    armed: armed,\r
    idle: !moving,\r
    activity: activity,\r
    distanceMeters: currentProgressMeters,\r
    totalDistanceMeters: totalTrackLengthMeters,\r
    sessionDistance: sessionDistance,\r
    elevGain: elevGain, elevLoss: elevLoss, laps: laps,\r
    elapsedS: Math.round(elapsedS),\r
    // ---- piste ----\r
    mode: trackMode ? 'track' : 'free',\r
    trackMode: trackMode,\r
    lane: trackMode ? trackLane : null,\r
    laneLength: trackMode ? Math.round(trackLaneLength * 100) / 100 : null,\r
    lapNumber: trackMode ? laps + 1 : null,\r
    lapDistance: trackMode ? Math.round(currentProgressMeters * 10) / 10 : null,\r
    lapPercent: trackMode && trackLaneLength > 0\r
      ? Math.round((currentProgressMeters / trackLaneLength) * 1000) / 10 : null,\r
    // ---- séance / physiologie ----\r
    workoutActive: wkActive,\r
    workoutName: wk ? wk.sessionName : null,\r
    phaseKind: wk ? wk.kind : null,\r
    phaseLabel: wk ? wk.label : null,\r
    phaseRemainS: wk ? wk.phaseRemainS : null,\r
    pctVma: wk ? wk.pctVma : null,\r
    targetHr: wk ? wk.targetHr : null,\r
    zone: wk ? wk.zone : null,\r
    hr: Math.round(currentHr),\r
    vma: athlete.vma,\r
    timestamp: Date.now()\r
  });\r
}\r
\r
function setAnchor(lat, lon, smoothMs2) {\r
  const prev = currentFixPoint();\r
  anchorPoint = [lat, lon];\r
  if (prev && smoothMs2 > 0) {\r
    warpFrom = prev;\r
    warpStart = Date.now();\r
    warpMs = smoothMs2;\r
  } else {\r
    warpFrom = null;\r
    warpMs = 0;\r
  }\r
  fetchElevBatch([[lat, lon]], [0])\r
    .then(r => { if (r && r.length && isFinite(r[0])) anchorAlt = Math.round(r[0] * 10) / 10; })\r
    .catch(() => {});\r
  broadcastCurrentPosition();\r
  updateIdleHeartbeat();\r
}\r
\r
function tick() {\r
  if (!isRunning || isPaused || rawTrack.length < 2 || totalTrackLengthMeters === 0) return;\r
\r
  const dt = 0.25;\r
  const metersPerSecond = (speedKmh * 1000) / 3600;\r
  const advanced = metersPerSecond * dt;\r
\r
  let next = currentProgressMeters + advanced;\r
  if (next >= totalTrackLengthMeters) {\r
    laps += Math.floor(next / totalTrackLengthMeters);\r
    next = next % totalTrackLengthMeters;\r
  }\r
  currentProgressMeters = next;\r
  sessionDistance += advanced;\r
  elapsedS += dt;\r
\r
  // moteur de séance : récupération automatique + pilotage de la vitesse\r
  tickWorkout(dt, advanced);\r
\r
  // FC hors séance : tend vers l'intensité correspondant à la vitesse\r
  if (!wkActive) {\r
    const pct = athlete.vma > 0 ? speedKmh / athlete.vma : 0.6;\r
    const target = hrForIntensity(pct);\r
    currentHr += (target - currentHr) * (1 - Math.exp(-dt / 25));\r
  }\r
\r
  const alt = eleAtDistance(currentProgressMeters);\r
  if (alt != null) {\r
    if (prevAlt != null) {\r
      const d = alt - prevAlt;\r
      if (d > 0.05) elevGain += d;\r
      else if (d < -0.05) elevLoss -= d;\r
    }\r
    prevAlt = alt;\r
  }\r
  broadcastCurrentPosition();\r
}\r

      <label style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;font-size:10.5px;color:#94a3b8;font-weight:700">\r
        <span>Anti-téléport : glissement doux (3 s)</span>\r
        <input type="checkbox" id="smoothToggle" checked style="accent-color:var(--fuchsia);width:15px;height:15px">\r
      </label>\r
      <div class="hint">Le pont armé envoie une position <b>même à l'arrêt</b> (vitesse 0) : le Pacer reçoit son fix immédiatement.</div>\r
    </div>\r
\r
    <div class="card">\r
      <h3>⚡ Vitesse manuelle</h3>\r
      <div style="display:flex;justify-content:space-between;align-items:baseline">\r
        <div><span class="mono" style="font-size:30px;font-weight:900" id="speedVal">11.0</span>\r
          <span style="color:var(--muted);font-size:11px">km/h</span></div>\r
        <div class="mono" style="color:var(--volt);font-weight:800;font-size:13px" id="paceVal">5:27 /km</div>\r
      </div>\r
      <input type="range" id="speedSlider" min="3" max="50" step="0.5" value="11" oninput="updateSpeed(this.value)">\r
      <div style="display:flex;gap:4px;flex-wrap:wrap">\r
        <button class="preset" onclick="setSpeed(5)">Marche 5</button>\r
        <button class="preset" onclick="setSpeed(10.9)">Endu 10.9</button>\r
        <button class="preset" onclick="setSpeed(15)">Semi 15</button>\r
        <button class="preset" onclick="setSpeed(25)">Vélo 25</button>\r
        <button class="preset" onclick="setSpeed(45)">Sprint 45</button>\r
      </div>\r
      <div class="hint">Pendant une séance, la vitesse est pilotée automatiquement par le moteur d'entraînement.</div>\r
    </div>\r
\r
    <div class="card">\r
      <h3>📊 Télémétrie détaillée</h3>\r
      <div class="grid2">\r
        <div class="tel"><div class="tel-t">DISTANCE</div><div class="tel-v" style="color:var(--volt)" id="distVal">0.00 km</div></div>\r
        <div class="tel"><div class="tel-t">ALTITUDE</div><div class="tel-v" style="color:var(--amber)" id="altVal">— m</div></div>\r
        <div class="tel"><div class="tel-t">DÉNIVELÉ +</div><div class="tel-v" style="color:var(--volt)" id="gainVal">0 m</div></div>\r
        <div class="tel"><div class="tel-t">DÉNIVELÉ −</div><div class="tel-v" style="color:var(--rose)" id="lossVal">0 m</div></div>\r
      </div>\r
    </div>\r
  </div>\r
\r
  <div class="footer">\r
    <button id="btnMain" class="mainbtn btn-start" onclick="toggleRun()">▶ LANCER LA SIMULATION</button>\r
    <button id="btnPause" class="mainbtn btn-pause" style="display:none;margin-top:7px" onclick="togglePause()">⏸ PAUSE</button>\r
  </div>\r
</div>\r
\r
<div id="map-container">\r
  <div id="map"></div>\r
  <button id="btnFollow" class="follow-pill" onclick="toggleAutoFollow()"><span>🎯</span> Auto-suivi : ON</button>\r
  <div class="hr-pill" id="hrPill">\r
    <div class="hr-v" id="hrBig">—</div><div class="hr-l">BPM</div>\r
  </div>\r
  <div id="phaseHud">\r
    <div class="ph-top">\r
      <span class="ph-kind" id="phKind">EFFORT</span>\r
      <span class="ph-sess" id="phSess"></span>\r
    </div>\r
    <div class="ph-label" id="phLabel">—</div>\r
    <div class="ph-timer" id="phTimer">0:00</div>\r
    <div class="ph-bar"><i id="phBar" style="width:0%"></i></div>\r
    <div class="ph-grid">\r
      <div class="ph-c"><b id="phSpeed" style="color:var(--volt)">—</b><span>KM/H</span></div>\r
      <div class="ph-c"><b id="phPace" style="color:var(--sky)">—</b><span>ALLURE</span></div>\r
      <div class="ph-c"><b id="phHr" style="color:var(--rose)">—</b><span>FC CIBLE</span></div>\r
    </div>\r
    <div class="ph-next">SUIVANT → <b id="phNext">—</b></div>\r
  </div>\r
</div>\r
\r
<script>\r
  // ============ CARTE ============\r
  var map = L.map('map', {zoomControl:true}).setView([43.421700, 6.675192], 17);\r
  map.zoomControl.setPosition('bottomright');\r
\r
  // ⚠️ TUILES (fix v3.1) : CARTO exige désormais une clé API ("API KEY REQUIRED"\r
  // imprimé sur les tuiles). Retour à OpenStreetMap — sans clé, identique à la\r
  // version d'origine — avec un FILTRE SOMBRE CSS sur un pane dédié pour garder\r
  // le rendu night-ops. Secours automatique vers Esri Dark (sans clé non plus).\r
  map.createPane('paneDark');\r
  var darkPane = map.getPane('paneDark');\r
  darkPane.style.zIndex = 200;\r
  darkPane.style.filter = 'invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.22)';\r
\r
  var OSM_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';\r
  var osmDark = L.tileLayer(OSM_URL, {pane:'paneDark', maxZoom:19,\r
    attribution:'© OpenStreetMap · Élévation Open-Meteo SRTM'});\r
  var esriDark = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',\r
    {maxZoom:19, attribution:'© Esri · © OpenStreetMap'});\r
  var osmStd = L.tileLayer(OSM_URL, {maxZoom:19, attribution:'© OpenStreetMap'});\r
  osmDark.addTo(map);\r
\r
  // 🛟 Secours auto : si OSM échoue → bascule Esri natif sombre (sans filtre)\r
  var tileBroken = false;\r
  osmDark.on('tileerror', function(){\r
    if (tileBroken) return;\r
    tileBroken = true;\r
    console.log('⚠️ Tuiles OSM en erreur → bascule sur Esri Dark');\r
    map.removeLayer(osmDark);\r
    esriDark.addTo(map);\r
  });\r
\r
  // 🎛️ Sélecteur de fond de carte (3 options, aucune clé requise)\r
  L.control.layers({\r
    'Sombre · OpenStreetMap': osmDark,\r
    'Sombre natif · Esri': esriDark,\r
    'Standard · OpenStreetMap': osmStd\r
  }, null, {position:'topleft'}).addTo(map);\r
\r
  var waypoints = [], trackPoints = [], routeDistanceM = null, routeRequestSeq = 0, loopClosed = true;\r
  var trackGlow = L.polyline([], {color:'#00e676',weight:9,opacity:0.22}).addTo(map);\r
  var trackLine = L.polyline([], {color:'#00e676',weight:5}).addTo(map);\r
  var markers = [], isRunning = false, currentActivity = 'running', currentSpeed = 11.0;\r
  var runnerMarker = null, autoFollow = true;\r
\r
  function showTab(id, btn) {\r
    var panes = document.querySelectorAll('.tabpane');\r
    for (var i=0;i<panes.length;i++) panes[i].classList.remove('active');\r
    document.getElementById('pane-'+id).classList.add('active');\r
    var tabs = document.querySelectorAll('.tab');\r
    for (var j=0;j<tabs.length;j++) tabs[j].classList.remove('active');\r
    btn.classList.add('active');\r
  }\r
\r
  function getRunnerColor(act) {\r
    var c = {running:'#00e676', cycling:'#38bdf8', hiking:'#ffab00', pacer:'#e879f9'};\r
    return c[act] || '#00e676';\r
  }\r
  function profileForActivity(act) { return act === 'cycling' ? 'routed-bike' : 'routed-foot'; }\r
  function createRunnerIcon(act) {\r
    var color = getRunnerColor(act);\r
    return L.divIcon({className:'', iconSize:[28,28], iconAnchor:[14,14],\r
      html:'<div style="width:28px;height:28px;border-radius:50%;background:'+color+';border:3px solid #05070b;box-shadow:0 0 20px '+color+';display:flex;align-items:center;justify-content:center;font-size:13px">🏃</div>'});\r
  }\r
  function toggleAutoFollow(){ autoFollow=!autoFollow; updateFollowButton(); }\r
  function updateFollowButton(){\r
    var b=document.getElementById('btnFollow');\r
    b.className = autoFollow ? 'follow-pill' : 'follow-pill off';\r
    b.innerHTML = autoFollow ? '<span>🎯</span> Auto-suivi : ON' : '<span>🖐️</span> Auto-suivi : OFF';\r
  }\r
  map.on('dragstart', function(){ if(autoFollow){autoFollow=false;updateFollowButton();} });\r
\r
  // ============ WEBSOCKET ============\r
  var ws = new WebSocket('ws://localhost:9876/?src=dashboard');\r
  ws.onmessage = function(event) {\r
    try {\r
      var d = JSON.parse(event.data);\r
      if (d.type === 'position') {\r
        var ll = [d.lat, d.lon];\r
        if (!runnerMarker) runnerMarker = L.marker(ll, {icon:createRunnerIcon(currentActivity)}).addTo(map);\r
        else { runnerMarker.setLatLng(ll); runnerMarker.setIcon(createRunnerIcon(currentActivity)); }\r
        if (autoFollow) map.panTo(ll, {animate:true, duration:0.45});\r
\r
        if (d.trackMode) {\r
          document.getElementById('distVal').textContent = 'T'+d.lapNumber+' · '+Math.round(d.lapDistance)+'/'+Math.round(d.laneLength)+' m';\r
        } else {\r
          document.getElementById('distVal').textContent =\r
            (d.distanceMeters/1000).toFixed(2)+' / '+(d.totalDistanceMeters/1000).toFixed(2)+' km';\r
        }\r
        document.getElementById('stDist').textContent = (d.sessionDistance/1000).toFixed(2);\r
        document.getElementById('altVal').textContent = Math.round(d.altitude)+' m';\r
        document.getElementById('stAlt').textContent = Math.round(d.altitude);\r
        document.getElementById('stSpeed').textContent = d.speedKmh.toFixed(1);\r
        if (typeof d.elevGain === 'number') document.getElementById('gainVal').textContent = Math.round(d.elevGain)+' m';\r
        if (typeof d.elevLoss === 'number') document.getElementById('lossVal').textContent = Math.round(d.elevLoss)+' m';\r
        if (typeof d.hr === 'number') {\r
          document.getElementById('stHr').textContent = d.hr;\r
          document.getElementById('hrBig').textContent = d.hr;\r
          document.getElementById('hrPill').classList.add('on');\r
        }\r
      } else if (d.type === 'workout') {\r
        renderPhaseHud(d);\r
      } else if (d.type === 'clients') {\r
        var el = document.getElementById('phoneChip');\r
        el.textContent = d.phones + ' 📱';\r
        el.style.color = d.phones > 0 ? 'var(--volt)' : 'var(--rose)';\r
      } else if (d.type === 'profile') {\r
        if (typeof d.startAltitude === 'number')\r
          document.getElementById('altVal').textContent = Math.round(d.startAltitude)+' m';\r
      } else if (d.type === 'trackmode') {\r
        // état piste géré côté UI\r
      } else if (d.type === 'stop') {\r
        if (runnerMarker) { map.removeLayer(runnerMarker); runnerMarker = null; }\r
      }\r
    } catch(e) {}\r
  };\r
\r
  // ============ HUD DE PHASE ============\r
  var KIND_STYLE = {\r
    work:      {bg:'#fb718522', fg:'#fb7185', t:'EFFORT'},\r
    recovery:  {bg:'#00e67622', fg:'#00e676', t:'RÉCUPÉRATION'},\r
    rest:      {bg:'#38bdf822', fg:'#38bdf8', t:'REPOS'},\r
    warmup:    {bg:'#ffab0022', fg:'#ffab00', t:'ÉCHAUFFEMENT'},\r
    cooldown:  {bg:'#94a3b822', fg:'#94a3b8', t:'RETOUR AU CALME'}\r
  };\r
  function fmtT(s) {\r
    s = Math.max(0, Math.round(s));\r
    var m = Math.floor(s/60), r = s%60;\r
    return m + ':' + (r<10?'0':'') + r;\r
  }\r
  function renderPhaseHud(d) {\r
    var hud = document.getElementById('phaseHud');\r
    if (!d.active) {\r
      hud.classList.remove('on');\r
      if (d.finished) alert('🏁 Séance « ' + d.name + ' » terminée en ' + Math.round(d.elapsedS/60) + ' min !');\r
      return;\r
    }\r
    hud.classList.add('on');\r
    var st = KIND_STYLE[d.kind] || KIND_STYLE.work;\r
    var k = document.getElementById('phKind');\r
    k.textContent = st.t + (d.rep ? '  ' + d.rep + '/' + d.repTotal : '');\r
    k.style.background = st.bg; k.style.color = st.fg;\r
    document.getElementById('phSess').textContent = d.sessionName + ' · ' + (d.phaseIndex+1) + '/' + d.phaseCount;\r
    document.getElementById('phLabel').textContent = d.label;\r
    var timer = document.getElementById('phTimer');\r
    timer.textContent = fmtT(d.phaseRemainS);\r
    timer.style.color = st.fg;\r
    var bar = document.getElementById('phBar');\r
    bar.style.width = d.phaseProgress + '%';\r
    bar.style.background = st.fg;\r
    document.getElementById('phSpeed').textContent = d.targetKmh.toFixed(1);\r
    document.getElementById('phPace').textContent = d.targetPace;\r
    document.getElementById('phHr').textContent = d.targetHr;\r
    document.getElementById('phNext').textContent = d.nextLabel;\r
  }\r
\r
  // ============ SÉANCES ============\r
  var SESS = [], curFamily = 'Tous', selectedSession = null;\r
\r
  function loadSessions() {\r
    fetch('http://localhost:9877/api/sessions').then(function(r){return r.json();}).then(function(d){\r
      SESS = d.sessions;\r
      var fams = ['Tous'];\r
      for (var i=0;i<SESS.length;i++) if (fams.indexOf(SESS[i].family) === -1) fams.push(SESS[i].family);\r
      var fr = document.getElementById('famRow');\r
      fr.innerHTML = '';\r
      fams.forEach(function(f){\r
        var b = document.createElement('button');\r
        b.className = 'fam' + (f === curFamily ? ' active' : '');\r
        b.textContent = f;\r
        b.onclick = function(){ curFamily = f; loadSessions(); };\r
        fr.appendChild(b);\r
      });\r
      renderSessions();\r
    });\r
  }\r
  function renderSessions() {\r
    var box = document.getElementById('sessList');\r
    box.innerHTML = '';\r
    SESS.filter(function(s){ return curFamily === 'Tous' || s.family === curFamily; })\r
      .forEach(function(s){\r
        var b = document.createElement('button');\r
        b.className = 'sess' + (selectedSession === s.id ? ' active' : '');\r
        b.innerHTML =\r
          '<div class="sess-h"><span style="font-size:15px">' + s.icon + '</span>' +\r
          '<span class="sess-n">' + s.name + '</span></div>' +\r
          '<div class="sess-d">' + s.desc + '</div>' +\r
          '<div class="sess-m"><span>⏱ ' + Math.round(s.totalS/60) + ' min</span>' +\r
          '<span>📏 ' + s.totalKm.toFixed(2) + ' km</span>' +\r
          '<span>🔁 ' + s.reps + ' efforts</span></div>';\r
        b.onclick = function(){ selectSession(s); };\r
        box.appendChild(b);\r
      });\r
  }\r
  function selectSession(s) {\r
    selectedSession = s.id;\r
    renderSessions();\r
    document.getElementById('sessDetail').style.display = 'block';\r
    document.getElementById('sessInfo').innerHTML =\r
      '<div style="font-size:14px;font-weight:900;color:#fff">' + s.icon + ' ' + s.name + '</div>' +\r
      '<div style="font-size:10.5px;color:#5b6678;margin-top:5px;line-height:1.5">' + s.desc + '</div>' +\r
      '<div class="grid3" style="margin-top:9px">' +\r
      '<div class="tel"><div class="tel-t">DURÉE</div><div class="tel-v" style="color:var(--volt)">' + Math.round(s.totalS/60) + "'</div></div>" +\r
      '<div class="tel"><div class="tel-t">DISTANCE</div><div class="tel-v" style="color:var(--sky)">' + s.totalKm.toFixed(1) + '</div></div>' +\r
      '<div class="tel"><div class="tel-t">EFFORTS</div><div class="tel-v" style="color:var(--fuchsia)">' + s.reps + '</div></div></div>';\r
  }\r
  function launchWorkout() {\r
    if (!selectedSession) { alert('Choisis une séance !'); return; }\r
    fetch('http://localhost:9877/api/workout/start?id=' + selectedSession)\r
      .then(function(r){return r.json();}).then(function(d){\r
        if (d.error) { alert(d.error); return; }\r
        if (!isRunning) toggleRun();\r
      });\r
  }\r
  function stopWorkoutUI() {\r
    fetch('http://localhost:9877/api/workout/stop');\r
    document.getElementById('phaseHud').classList.remove('on');\r
  }\r
\r
  // ============ ATHLÈTE / VMA ============\r
  function onAthleteInput(){ /* live preview au clic sur Appliquer */ }\r
  function useTanaka(){\r
    var age = parseInt(document.getElementById('inAge').value,10) || 35;\r
    document.getElementById('inFcMax').value = Math.round(208 - 0.7*age);\r
    saveAthlete();\r
  }\r
  function useAstrand(){\r
    var age = parseInt(document.getElementById('inAge').value,10) || 35;\r
    document.getElementById('inFcMax').value = 220 - age;\r
    saveAthlete();\r
  }\r
  function saveAthlete() {\r
    var q = '?age=' + document.getElementById('inAge').value +\r
            '&fcRepos=' + document.getElementById('inFcRepos').value +\r
            '&fcMax=' + document.getElementById('inFcMax').value +\r
            '&vma=' + document.getElementById('inVma').value +\r
            '&poids=' + document.getElementById('inPoids').value;\r
    fetch('http://localhost:9877/api/athlete' + q)\r
      .then(function(r){return r.json();}).then(function(d){ renderAthlete(d); loadSessions(); });\r
  }\r
  function loadAthlete() {\r
    fetch('http://localhost:9877/api/athlete').then(function(r){return r.json();}).then(function(d){\r
      document.getElementById('inAge').value = d.athlete.age;\r
      document.getElementById('inFcRepos').value = d.athlete.fcRepos;\r
      document.getElementById('inFcMax').value = d.athlete.fcMax;\r
      document.getElementById('inVma').value = d.athlete.vma;\r
      document.getElementById('inPoids').value = d.athlete.poids;\r
      renderAthlete(d);\r
    });\r
  }\r
  function renderAthlete(d) {\r
    var a = d.athlete;\r
    document.getElementById('athleteHint').innerHTML =\r
      'FC réserve : <b style="color:var(--volt)">' + (a.fcMax - a.fcRepos) + ' bpm</b> · ' +\r
      'Tanaka : <b>' + d.tanaka + '</b> · Astrand : <b>' + d.astrand + '</b> · ' +\r
      'Allure VMA : <b style="color:var(--sky)">' + d.vmaPace + ' /km</b>';\r
    var tb = document.getElementById('vmaBody');\r
    tb.innerHTML = '';\r
    d.table.forEach(function(r){\r
      var tr = document.createElement('tr');\r
      tr.innerHTML =\r
        '<td style="font-weight:800;color:#cbd5e1">' + r.pct + '%</td>' +\r
        '<td style="color:var(--volt);font-weight:800">' + r.kmh.toFixed(1) + '</td>' +\r
        '<td style="color:var(--sky)">' + r.pace + '</td>' +\r
        '<td style="color:var(--rose);font-weight:700">' + r.fc + '</td>' +\r
        '<td style="color:#7c8899">' + r.d30 + 'm</td>' +\r
        '<td style="font-size:9px"><span class="zdot" style="background:' + r.zoneColor + '"></span>Z' + r.zone + '</td>';\r
      tb.appendChild(tr);\r
    });\r
    var pb = document.getElementById('predBody');\r
    pb.innerHTML = '';\r
    d.predictions.forEach(function(p){\r
      var tr = document.createElement('tr');\r
      tr.innerHTML =\r
        '<td style="font-weight:800;color:#cbd5e1">' + p.dist + '</td>' +\r
        '<td style="color:var(--volt);font-weight:800">' + p.time + '</td>' +\r
        '<td style="color:var(--sky)">' + p.pace + '</td>' +\r
        '<td style="color:#7c8899">' + p.pct + '%</td>';\r
      pb.appendChild(tr);\r
    });\r
  }\r
\r
  // ============ PISTE ============\r
  var LANE_COLORS = ['#00e676','#38bdf8','#e879f9','#ffab00','#fb7185','#a78bfa','#2dd4bf','#f97316'];\r
  var laneLayers = [], trackActive = false, curLane = 1, curBearing = 90, trackOriginLL = null;\r
\r
  function clearLaneLayers(){ for(var i=0;i<laneLayers.length;i++) map.removeLayer(laneLayers[i]); laneLayers=[]; }\r
  function drawLanes(geometry) {\r
    clearLaneLayers();\r
    if (!geometry || !geometry.length) return;\r
    laneLayers.push(L.polygon(geometry[0], {color:'#14532d',weight:1,opacity:.5,fillColor:'#022c22',fillOpacity:.5,interactive:false}).addTo(map));\r
    for (var i=0;i<geometry.length;i++) {\r
      var active = (i+1) === curLane;\r
      laneLayers.push(L.polyline(geometry[i], {color:LANE_COLORS[i], weight:active?4:1.5, opacity:active?.95:.4, interactive:false}).addTo(map));\r
      laneLayers.push(L.marker(geometry[i][0], {interactive:false, icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],\r
        html:'<div style="display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#0b0e15;border:1.5px solid '+LANE_COLORS[i]+';color:'+LANE_COLORS[i]+';font-size:9px;font-weight:800">'+(i+1)+'</div>'})}).addTo(map));\r
    }\r
  }\r
  function setLane(n) {\r
    curLane = n;\r
    var btns = document.querySelectorAll('.lane-btn');\r
    for (var i=0;i<btns.length;i++) btns[i].classList.toggle('active', parseInt(btns[i].getAttribute('data-lane'),10) === n);\r
    if (trackActive) placeTrack(true);\r
  }\r
  function setBearing(v) {\r
    curBearing = parseInt(v,10);\r
    document.getElementById('brgVal').textContent = curBearing + '°';\r
    if (trackActive) placeTrack(true);\r
  }\r
  function placeTrack(keepCenter) {\r
    var c = (trackActive && keepCenter && trackOriginLL) ? trackOriginLL : map.getCenter();\r
    trackOriginLL = c;\r
    fetch('http://localhost:9877/api/track-mode?lat='+c.lat+'&lon='+c.lng+'&bearing='+curBearing+'&lane='+curLane)\r
      .then(function(r){return r.json();}).then(function(d){\r
        if (d.error) { alert(d.error); return; }\r
        trackActive = true;\r
        drawLanes(d.geometry);\r
        trackGlow.setLatLngs([]); trackLine.setLatLngs([]);\r
        for (var i=0;i<markers.length;i++) map.removeLayer(markers[i]);\r
        markers=[]; waypoints=[]; trackPoints=[];\r
        document.getElementById('trackState').innerHTML =\r
          '🏟️ <b style="color:var(--volt)">Couloir '+d.lane+'</b> — tour de <b style="color:var(--volt)">'+d.laneLength.toFixed(2)+' m</b> — cap '+curBearing+'°';\r
        document.getElementById('trackInfo').innerHTML =\r
          '🏟️ Mode piste actif — couloir '+d.lane+' — <b style="color:var(--volt)">'+d.laneLength.toFixed(2)+' m</b> / tour';\r
      });\r
  }\r
  function exitTrack() {\r
    trackActive = false; trackOriginLL = null; clearLaneLayers();\r

    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);\r

\r
  function toggleRun() {\r

const server = http.createServer((req, res) => {\r
  const url = new URL(req.url, 'http://localhost:9877');\r

\r
  // ---------- page ----------\r
  if (url.pathname === '/') {\r
    res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });\r
    res.end(getHtmlContent());\r
\r
  // ---------- télémétrie injectée depuis UI moderne ----------\r
  } else if (url.pathname === '/api/telemetry') {\r
    let body = '';\r
    req.on('data', chunk => body += chunk);\r
    req.on('end', () => {\r
      try {\r
        const msg = JSON.parse(body);\r
        const out = {\r
          type: 'position',\r
          lat: msg.lat,\r
          lon: msg.lon ?? msg.lng,\r
          lng: msg.lng ?? msg.lon,\r
          speed: msg.speed != null ? msg.speed : (msg.speedKmh ? (msg.speedKmh * 1000) / 3600 : 0),\r
          speedKmh: msg.speedKmh != null ? msg.speedKmh : (msg.speed ? msg.speed * 3.6 : 0),\r
          heading: msg.heading || 0,\r
          altitude: msg.alt != null ? msg.alt : (msg.altitude != null ? msg.altitude : baseAlt),\r
          altitudeSource: msg.eleReal ? 'srtm' : 'fallback',\r
          accuracy: msg.accuracy != null ? msg.accuracy : 3.0,\r
          provider: 'gps',\r
          satellites: 12,\r
          bearingAccuracy: 5.0,\r
          hr: msg.hr || 0,\r
          cadence: msg.cadence || 0,\r
          timestamp: Date.now()\r
        };\r
        clients.filter(c => c._rcKind === 'phone').forEach(c => {\r
          if (c.readyState === 1) c.send(JSON.stringify(out));\r
        });\r
        json({ ok: true, phones: phoneCount() });\r
      } catch (e) {\r
        json({ error: e.message });\r
      }\r
    });\r
\r
  } else if (url.pathname === '/api/inject_stop') {\r
    clients.filter(c => c._rcKind === 'phone').forEach(c => {\r

    });\r
    json({ ok: true });\r
\r
  // ---------- simulation ----------\r
  } else if (url.pathname === '/api/start') {\r

    isPaused = false;\r
    currentProgressMeters = 0;\r
    sessionDistance = 0;\r
    elevGain = 0; elevLoss = 0; laps = 0; elapsedS = 0;\r
    const startAlt = eleAtDistance(0);\r
    prevAlt = startAlt != null ? startAlt : baseAlt;\r
    if (idleInterval) { clearInterval(idleInterval); idleInterval = null; }\r
    const smooth = parseInt(url.searchParams.get('smooth') || '0', 10);\r
    if (smooth > 0 && warpFrom) { warpStart = Date.now(); warpMs = smooth; }\r
    if (!simInterval) simInterval = setInterval(tick, 250);\r
    broadcastCurrentPosition();\r

  } else if (url.pathname === '/api/config') {\r

\r

\r

    const had = url.searchParams.toString().length > 0;\r
    if (had) {\r
      athlete.age = Math.round(num('age', 10, 99, athlete.age));\r

\r
  // ---------- séances ----------\r
  } else if (url.pathname === '/api/sessions') {\r

  } else if (url.pathname === '/api/session') {\r

\r
  } else if (url.pathname === '/api/workout/start') {\r

  } else if (url.pathname === '/api/workout/stop') {\r

\r
  } else if (url.pathname === '/api/workout/skip') {\r

\r
  } else if (url.pathname === '/api/workout') {\r
    json(workoutState());\r
\r
  // ---------- piste d'athlétisme ----------\r
  } else if (url.pathname === '/api/track-mode') {\r

    }\r
    const lat = parseFloat(url.searchParams.get('lat'));\r
    const lon = parseFloat(url.searchParams.get('lon'));\r

\r
    trackMode = true;\r

    trackLaneLength = laneLength(lane);\r
    rawTrack = buildLanePolyline(trackOrigin, trackBearing, lane, 2);\r
    trackCum = computeCumulative(rawTrack);\r
    totalTrackLengthMeters = trackLaneLength;  // longueur OFFICIELLE du couloir\r
    currentProgressMeters = 0;\r
    anchorPoint = rawTrack[0];\r
    laps = 0; sessionDistance = 0;\r

    trackEle = null;\r
\r
    broadcast({\r
      type: 'trackmode', active: true, lane: lane,\r

\r

\r
